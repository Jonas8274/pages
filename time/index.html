<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock – Jonas</title>
  <link rel="icon" href="/clock.jpg">
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #111;
      color: white;
    }
    a {
      color: #aef;
      font-size: 1.2rem;
    }
    .clock-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #time {
      font-size: 5rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: white;
      font-variant-numeric: tabular-nums;
    }
    #date {
      font-size: 1.1rem;
      color: #aaa;
    }
    #tz {
      font-size: 0.85rem;
      color: #555;
    }
    .back {
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="clock-box">
    <div id="time">00:00:00</div>
    <div id="date"></div>
    <div id="tz"></div>
    <div class="back"><a href="/">← Back home</a></div>
    <button onclick="document.documentElement.requestFullscreen()" style="margin-top:12px;background:none;border:1px solid #333;color:#aaa;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.85rem;">⛶ Fullscreen</button>
  </div>
  <script>
    const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    try {
      document.getElementById('tz').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;
    } catch(e) {}

    function update() {
      const now = new Date();
      document.title = now.toLocaleTimeString();
      document.getElementById('time').textContent = now.toLocaleTimeString();
      document.getElementById('date').textContent =
        days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ' ' + now.getFullYear();
    }
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>

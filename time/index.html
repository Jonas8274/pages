<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock – Jonas</title>
  <link rel="icon" href="/clock.jpg">
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #111;
      color: white;
    }
    a {
      color: #aef;
      font-size: 1.2rem;
    }
    .clock-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #time {
      font-size: 5rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: white;
      font-variant-numeric: tabular-nums;
    }
    #date {
      font-size: 1.1rem;
      color: #aaa;
    }
    #tz {
      font-size: 0.85rem;
      color: #555;
    }
    .back {
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="clock-box">
    <div id="time">00:00:00</div>
    <div id="date"></div>
    <div id="tz"></div>
    <div class="back"><a href="/">← Back home</a></div>
    <button onclick="document.documentElement.requestFullscreen()" style="margin-top:12px;background:none;border:1px solid #333;color:#aaa;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.85rem;">⛶ Fullscreen</button>
  </div>
  <script>
    const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    const tz = (() => {
      try { return Intl.DateTimeFormat().resolvedOptions().timeZone; }
      catch (e) { return 'UTC'; }
    })();

    // Offset (ms) to add to the browser's Date.now() to get the real server time.
    // Stays 0 (i.e. falls back to the local clock) until a sync succeeds.
    let offset = 0;

    function setTzLabel(status) {
      document.getElementById('tz').textContent = tz + (status ? ' · ' + status : '');
    }

    async function syncTime() {
      try {
        const t0 = performance.now();
        // Cloudflare's edge stamps this response fresh on every single request
        // (huge network, effectively impossible to serve a stale/cached copy),
        // and returns a plain UTC unix timestamp — no timezone-name matching,
        // no JSON parsing quirks. Format is plain text, one key=value per line,
        // including a line like "ts=1735999999.123".
        const res = await fetch('https://www.cloudflare.com/cdn-cgi/trace', { cache: 'no-store' });
        const t1 = performance.now();
        if (!res.ok) throw new Error('bad response');
        const text = await res.text();
        const match = text.match(/^ts=([\d.]+)/m);
        if (!match) throw new Error('no ts field in response: ' + text);

        const serverMs = parseFloat(match[1]) * 1000;
        if (isNaN(serverMs)) throw new Error('unparseable ts');

        // account for the round-trip network delay
        const candidateOffset = (serverMs + (t1 - t0) / 2) - Date.now();

        // Sanity check: if the "correction" is implausibly large, the response
        // was probably malformed — don't trust it.
        if (Math.abs(candidateOffset) > 12 * 60 * 60 * 1000) {
          throw new Error('offset implausible: ' + candidateOffset);
        }

        offset = candidateOffset;
        setTzLabel('synced');
        console.log('[clock] synced OK via Cloudflare. computed offset (ms):', candidateOffset);
      } catch (e) {
        offset = 0;
        setTzLabel('local clock');
        console.warn('[clock] sync failed, falling back to local clock:', e);
      }
    }

    function update() {
      const now = new Date(Date.now() + offset);
      const timeStr = now.toLocaleTimeString();
      document.title = timeStr;
      document.getElementById('time').textContent = timeStr;
      document.getElementById('date').textContent =
        days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ' ' + now.getFullYear();
    }

    setTzLabel('syncing…');
    syncTime();
    update();
    setInterval(update, 1000);
    setInterval(syncTime, 5 * 60 * 1000); // re-sync every 5 minutes
  </script>
</body>
</html>

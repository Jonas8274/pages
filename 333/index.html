<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>333</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #sound {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: rgba(0, 0, 0, 0.35);
      font: 20px Arial, sans-serif;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>

<body>

  <video id="video" autoplay muted playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>

  <div id="sound">Tap to enable sound</div>

  <script>
    const video = document.getElementById("video");
    const sound = document.getElementById("sound");

    sound.addEventListener("click", () => {
      video.muted = false;
      video.play();
      sound.style.display = "none";
    });
  </script>

</body>
</html>

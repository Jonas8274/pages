<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jonas</title>
  <link rel="icon" href="/download.png">
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #111;
      color: white;
    }
    a {
      color: #aef;
      font-size: 1.2rem;
    }
    #clock {
      position: fixed;
      top: 16px;
      right: 20px;
      font-size: 1rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="clock"></div>
  <h1>Welcome to My page! (I'm Jonas btw)</h1>
  <p><a href="/socials">View my socials →</a></p>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString();
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
